<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Compras</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 42'><circle cx='21' cy='21' r='20' fill='%232D6A4F'/><path d='M12 14h3l2.2 12.5a2 2 0 0 0 2 1.6h9.6a2 2 0 0 0 2-1.6L32 17H16' stroke='%23FAF7F0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='19' cy='31' r='1.8' fill='%23FAF7F0'/><circle cx='27' cy='31' r='1.8' fill='%23FAF7F0'/></svg>">
<style>
  :root{
    --paper:#FAF7F0;
    --ink:#1F2A24;
    --line:#D8D2C2;
    --green:#2D6A4F;
    --green-soft:#E6F0EA;
    --amber:#C9752B;
    --amber-soft:#FBECDD;
    --red:#B3452E;
    --blue:#3A6EA5;
    --white:#FFFFFF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding-bottom:60px;
  }
  header{
    padding:18px 16px 14px;
    border-bottom:2px dashed var(--line);
    background:var(--white);
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo{flex-shrink:0;}
  header .titulos h1{margin:0 0 2px;font-size:1.3rem;letter-spacing:0.3px;}
  header .titulos .sub{font-size:0.75rem;color:#6b6b60;display:flex;align-items:center;gap:5px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;}
  .dot.off{background:var(--red);}

  .totals{display:flex;gap:10px;padding:14px 16px 6px;flex-wrap:wrap;}
  .totals .card{flex:1;min-width:120px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;}
  .totals .card .label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.5px;color:#8a8a7c;display:block;margin-bottom:3px;}
  .totals .card .val{font-size:1.15rem;font-weight:700;font-family:'Courier New',monospace;}
  .totals .card.pend .val{color:var(--amber);}
  .totals .card.comp .val{color:var(--green);}
  .totals .card.gran .val{color:var(--ink);}

  .add-bar{display:flex;gap:6px;padding:10px 16px;flex-wrap:wrap;background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
  .add-bar input, .add-bar select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:0.95rem;background:var(--paper);color:var(--ink);}
  #f-nombre{flex:2 1 140px;}
  #f-precio{flex:1 1 80px;}
  #f-cant{flex:1 1 65px;}
  #f-categoria{flex:1 1 150px;}
  .add-bar button{flex:0 0 auto;border:none;background:var(--green);color:#fff;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.95rem;}
  .add-bar button:active{transform:scale(0.97);}

  .filtros{
    display:flex;
    gap:7px;
    padding:10px 16px;
    overflow-x:auto;
    background:var(--white);
    border-bottom:1px solid var(--line);
    -webkit-overflow-scrolling:touch;
    position:sticky;
    top:56px;
    z-index:4;
  }
  .filtros::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:5px;
    padding:6px 12px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:0.78rem;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
    white-space:nowrap;
  }
  .chip .chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip .count{opacity:0.65;font-weight:500;}

  .list{padding:8px 16px 4px;}

  .cat-header{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 5px;margin-top:6px;}
  .cat-header .cat-nombre{font-size:0.85rem;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;display:flex;align-items:center;gap:6px;}
  .cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .cat-header .cat-subtotal{font-family:'Courier New',monospace;font-size:0.82rem;color:#6b6b60;font-weight:700;}

  .item{
    display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:8px;
    padding:11px 10px 11px 12px;
    background:var(--white);
    border:1px solid var(--line);
    border-left:5px solid var(--cat-color, var(--line));
    border-radius:var(--radius);
    margin-bottom:8px;
  }
  .item.comprado{background:var(--green-soft);opacity:0.8;}
  .item.comprado .nombre{text-decoration:line-through;color:#5c6f63;}
  .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--green);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.85rem;color:var(--green);flex-shrink:0;}
  .item.comprado .check{background:var(--green);color:#fff;}
  .info{cursor:pointer;min-width:0;}
  .info .nombre{font-weight:600;font-size:0.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .info .detalle{font-size:0.78rem;color:#7a7a6e;font-family:'Courier New',monospace;margin-top:2px;}
  .subtotal{font-family:'Courier New',monospace;font-weight:700;font-size:0.98rem;text-align:right;min-width:60px;}
  .edit-btn{border:none;background:none;color:var(--blue);font-size:1rem;cursor:pointer;padding:4px 4px;flex-shrink:0;}
  .del{border:none;background:none;color:var(--red);font-size:1.1rem;cursor:pointer;padding:4px 4px;flex-shrink:0;}
  .empty{text-align:center;color:#9a9a8c;padding:30px 10px;font-size:0.9rem;}

  /* Edicion en linea, dentro de la misma fila */
  .item.editando{
    background:var(--amber-soft);
    border-color:var(--amber);
    border-left-color:var(--amber);
    align-items:start;
  }
  .item.editando .check{margin-top:2px;}
  .info-edit{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .info-edit input.e-nombre-inline{
    font-weight:600; font-size:0.95rem; border:1px solid var(--line); border-radius:6px;
    padding:6px 8px; background:var(--white); width:100%; color:var(--ink);
  }
  .fila-mini{display:flex; align-items:center; gap:5px; flex-wrap:wrap;}
  .fila-mini input.e-cant-inline, .fila-mini input.e-precio-inline{
    width:58px; border:1px solid var(--line); border-radius:6px; padding:5px 6px;
    font-family:'Courier New',monospace; font-size:0.8rem; background:var(--white); color:var(--ink);
  }
  .fila-mini input.e-precio-inline{width:74px;}
  .fila-mini .x-sep{font-size:0.78rem; color:#7a7a6e;}
  .fila-mini select.e-cat-inline{
    border:1px solid var(--line); border-radius:6px; padding:5px 6px; font-size:0.7rem;
    background:var(--white); color:var(--ink); max-width:118px;
  }
  .item.editando .subtotal{align-self:start; margin-top:2px;}
  .accion-ok{border:none;background:none;color:var(--green);font-size:1.2rem;cursor:pointer;padding:4px 4px;flex-shrink:0;align-self:start;}
  .accion-cancel{border:none;background:none;color:var(--red);font-size:1.05rem;cursor:pointer;padding:4px 4px;flex-shrink:0;align-self:start;}

  .actions{display:flex;gap:8px;padding:10px 16px 4px;flex-wrap:wrap;}
  .actions button{flex:1;min-width:130px;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--white);font-weight:600;font-size:0.9rem;cursor:pointer;}
  #btn-copiar{color:var(--green);border-color:var(--green);}
  #btn-finalizar{color:var(--amber);border-color:var(--amber);}
  #btn-finalizar:disabled{opacity:0.4;cursor:default;}
  #btn-importar{color:var(--blue);border-color:var(--blue);}
  #btn-desmarcar{color:#6C5B7B;border-color:#6C5B7B;}

  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:20px;font-size:0.85rem;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:0.95;}

  section.hist{padding:6px 16px 30px;}
  section.hist h2{font-size:0.95rem;color:#6b6b60;border-top:2px dashed var(--line);padding-top:14px;margin:10px 0 8px;}
  .hist-item{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .hist-item .fecha{font-size:0.82rem;color:#6b6b60;}
  .hist-item .monto{font-family:'Courier New',monospace;font-weight:700;color:var(--amber);}
  .hist-item .borrar-h{border:none;background:none;color:var(--red);font-size:0.95rem;margin-left:8px;cursor:pointer;}
  .hist-detalle{font-size:0.8rem;color:#555;background:var(--amber-soft);border-radius:8px;padding:8px 10px;margin:-2px 0 8px;display:none;}
  .hist-detalle.show{display:block;}
</style>
</head>

<header>
  <svg class="logo" width="42" height="42" viewBox="0 0 42 42" fill="none">
    <circle cx="21" cy="21" r="20" fill="#2D6A4F"/>
    <path d="M12 14h3l2.2 12.5a2 2 0 0 0 2 1.6h9.6a2 2 0 0 0 2-1.6L32 17H16" stroke="#FAF7F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

<div class="totals">

</div>

<div class="add-bar">

  <input id="f-precio" type="number" placeholder="Precio" step="0.01" min="0">
  <input id="f-cant" type="number" placeholder="Cant." value="1" min="1">
  <button id="btn-add">+ Agregar</button>
</div>

<div class="filtros" id="filtros"></div>

<div class="list" id="lista"><div class="empty">Cargando lista...</div></div>

<div class="actions">
  <button id="btn-copiar">📋 Copiar lista</button>
  <button id="btn-finalizar" disabled>✅ Finalizar compra</button>
  <button id="btn-desmarcar">↺ Desmarcar todos</button>
  <button id="btn-importar">📥 Importar planilla</button>
</div>

<section class="hist">
  <h2>Historial de gastos</h2>
  <div id="historial"><div class="empty">Cargando historial...</div></div>
</section>

<div class="toast" id="toast"></div>

const CACHE_KEY = 'lista_compras_cache';
let items = [];
let historial = [];
let listo = false;
let filtroActivo = 'Todas';
let editIndex = null;
let itemsSaveTimeout = null;

const $ = id => document.getElementById(id);
const fmt = n => '$' + n.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
const colorCat = nombre => (CATEGORIAS.find(c=>c.nombre===nombre) || CATEGORIAS[CATEGORIAS.length-1]).color;
const opcionesCategoria = (seleccionada) => CATEGORIAS.map(c=>`<option value="${c.nombre}" ${c.nombre===seleccionada?'selected':''}>${c.nombre}</option>`).join('');

function llenarSelectCategorias(){
  $('f-categoria').innerHTML = opcionesCategoria('Almacén / Despensa');
}

function marcarSync(ok, msg){
  $('sync-dot').classList.toggle('off', !ok);
  $('sync-txt').textContent = msg || (ok ? 'Sincronizada' : 'Sin conexión, guardado local');
}

function guardarCacheLocal(){
  localStorage.setItem(CACHE_KEY, JSON.stringify({items, historial}));
}

async function cargarDatos(){
  // Pintado instantáneo con la última copia local, mientras llega la nube
  try{
    const cache = localStorage.getItem(CACHE_KEY);
    if(cache){
      const d = JSON.parse(cache);
      items = d.items || [];
      historial = d.historial || [];
      listo = true;
      render();
    }
  }catch(e){}

  // Los items se muestran apenas llegan, sin esperar al historial (que suele pesar mas)
  try{
    const r = await fetch('/api/items');
    if(!r.ok) throw new Error('items fetch failed');
    items = await r.json();
    listo = true;
    guardarCacheLocal();
    marcarSync(true);
    render();
  }catch(e){
    listo = true;
    marcarSync(false, 'Sin conexión, mostrando copia local');
    render();
  }

  // El historial se trae en segundo plano y no bloquea la vista principal
  try{
    const r2 = await fetch('/api/historial');
    if(!r2.ok) throw new Error('historial fetch failed');
    historial = await r2.json();
    guardarCacheLocal();
    renderHistorial();
  }catch(e){
    // silencioso: se queda con lo que haya en la copia local
  }
}

function guardarItems(inmediato){
  guardarCacheLocal();
  clearTimeout(itemsSaveTimeout);
  const enviar = async () => {
    try{
      const r = await fetch('/api/items', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({items})
      });
      if(!r.ok) throw new Error('save failed');
      marcarSync(true);
    }catch(e){
      marcarSync(false, 'No se pudo guardar en la nube (se guardó local)');
    }
  };
  if(inmediato){
    enviar();
  } else {
    marcarSync(true, 'Guardando...');
    itemsSaveTimeout = setTimeout(enviar, 400);
  }
}

async function guardarHistorial(){
  guardarCacheLocal();
  try{
    const r = await fetch('/api/historial', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({historial})
    });
    if(!r.ok) throw new Error('save failed');
    marcarSync(true);
  }catch(e){
    marcarSync(false, 'No se pudo guardar en la nube (se guardó local)');
  }
}

// Si la app pasa a segundo plano con un guardado pendiente, lo mandamos igual con sendBeacon
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden' && itemsSaveTimeout){
    clearTimeout(itemsSaveTimeout);
    itemsSaveTimeout = null;
    try{
      const blob = new Blob([JSON.stringify({items})], {type:'application/json'});
      navigator.sendBeacon('/api/items', blob);
    }catch(e){}
  }
});

function renderFiltros(){
  const cont = $('filtros');
  const totalCount = items.length;
  let html = `<div class="chip ${filtroActivo==='Todas'?'active':''}" onclick="setFiltro('Todas')">Todas <span class="count">(${totalCount})</span></div>`;
  CATEGORIAS.forEach(cat=>{
    const n = items.filter(it => (it.categoria||'Otros') === cat.nombre).length;
    if(n === 0) return;
    html += `<div class="chip ${filtroActivo===cat.nombre?'active':''}" onclick="setFiltro('${cat.nombre.replace(/'/g,"\\'")}')">
      <span class="chip-dot" style="background:${cat.color}"></span>${cat.nombre} <span class="count">(${n})</span>
    </div>`;
  });
  cont.innerHTML = html;
}

function setFiltro(nombre){
  filtroActivo = nombre;
  editIndex = null;
  render();
}

function render(){
  const cont = $('lista');
  if(!listo) return;

  renderFiltros();

  if(items.length === 0){
    cont.innerHTML = '<div class="empty">Sin productos aún. Agregá el primero arriba 👆</div>';
  } else {
    const categoriasAMostrar = filtroActivo === 'Todas' ? CATEGORIAS : CATEGORIAS.filter(c=>c.nombre===filtroActivo);
    let html = '';
    let hayAlgo = false;
    categoriasAMostrar.forEach(cat=>{
      const deEstaCat = items.map((it,i)=>({...it, _i:i})).filter(it => (it.categoria || 'Otros') === cat.nombre);
      if(deEstaCat.length === 0) return;
      hayAlgo = true;
      const subtotalCat = deEstaCat.reduce((s,it)=>s+it.precio*it.cant,0);
      html += `<div class="cat-header">
        <span class="cat-nombre"><span class="cat-dot" style="background:${cat.color}"></span>${cat.nombre}</span>
        <span class="cat-subtotal">${fmt(subtotalCat)}</span>
      </div>`;
      deEstaCat.forEach(it=>{
        if(it._i === editIndex){
          html += renderFilaEdicion(it);
          return;
        }
        const sub = it.precio * it.cant;
        const colorBorde = colorCat(it.categoria || 'Otros');
        html += `<div class="item ${it.comprado?'comprado':''}" style="--cat-color:${colorBorde}">
          <button class="check" onclick="toggle(${it._i})">${it.comprado?'✓':''}</button>
          <div class="info" onclick="iniciarEdicion(${it._i})">
            <div class="nombre">${escapeHtml(it.nombre)}</div>
            <div class="detalle">${it.cant} x ${fmt(it.precio)}</div>
          </div>
          <div class="subtotal">${fmt(sub)}</div>
          <button class="edit-btn" onclick="iniciarEdicion(${it._i})">✏️</button>
          <button class="del" onclick="borrar(${it._i})">🗑</button>
        </div>`;
      });
    });
    cont.innerHTML = hayAlgo ? html : '<div class="empty">No hay productos en esta categoría.</div>';
  }

  const pend = items.filter(i=>!i.comprado).reduce((s,i)=>s+i.precio*i.cant,0);
  const comp = items.filter(i=>i.comprado).reduce((s,i)=>s+i.precio*i.cant,0);
  $('t-pend').textContent = fmt(pend);
  $('t-comp').textContent = fmt(comp);
  $('t-gran').textContent = fmt(pend+comp);

  $('btn-finalizar').disabled = items.length === 0;

  renderHistorial();

  if(editIndex !== null){
    const inp = document.getElementById(`e-nombre-${editIndex}`);
    if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
}

function renderFilaEdicion(it){
  const i = it._i;
  const colorBorde = colorCat(it.categoria || 'Otros');
  return `<div class="item editando" style="--cat-color:${colorBorde}">
    <button class="check" onclick="toggle(${i})">${it.comprado?'✓':''}</button>
    <div class="info-edit">
      <input class="e-nombre-inline" type="text" id="e-nombre-${i}" value="${escapeAttr(it.nombre)}" onkeydown="if(event.key==='Enter')guardarEdicion(${i})">
      <div class="fila-mini">
        <input class="e-cant-inline" type="number" min="1" id="e-cant-${i}" value="${it.cant}" oninput="actualizarSubtotalEdicion(${i})" onkeydown="if(event.key==='Enter')guardarEdicion(${i})">
        <span class="x-sep">x</span>
        <input class="e-precio-inline" type="number" step="0.01" min="0" id="e-precio-${i}" value="${it.precio}" oninput="actualizarSubtotalEdicion(${i})" onkeydown="if(event.key==='Enter')guardarEdicion(${i})">
        <select class="e-cat-inline" id="e-categoria-${i}">${opcionesCategoria(it.categoria||'Otros')}</select>
      </div>
    </div>
    <div class="subtotal" id="edit-subtotal-${i}">${fmt(it.precio*it.cant)}</div>
    <button class="accion-ok" onclick="guardarEdicion(${i})">✓</button>
    <button class="accion-cancel" onclick="cancelarEdicion()">✕</button>
  </div>`;
}

function actualizarSubtotalEdicion(i){
  const cant = parseFloat($(`e-cant-${i}`).value) || 0;
  const precio = parseFloat($(`e-precio-${i}`).value) || 0;
  const el = $(`edit-subtotal-${i}`);
  if(el) el.textContent = fmt(cant*precio);
}

function iniciarEdicion(i){
  editIndex = i;
  render();
}

function cancelarEdicion(){
  editIndex = null;
  render();
}

function guardarEdicion(i){
  const nombre = $(`e-nombre-${i}`).value.trim();
  const categoria = $(`e-categoria-${i}`).value;
  const precio = parseFloat($(`e-precio-${i}`).value) || 0;
  const cant = parseInt($(`e-cant-${i}`).value) || 1;
  if(!nombre){ return; }
  items[i] = {...items[i], nombre, categoria, precio, cant};
  editIndex = null;
  render();
  guardarItems(true);
  mostrarToast('Producto actualizado ✏️');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escapeAttr(s){
  return escapeHtml(s).replace(/"/g, '&quot;');
}

function toggle(i){ items[i].comprado = !items[i].comprado; render(); guardarItems(false); }
function borrar(i){ items.splice(i,1); if(editIndex===i) editIndex=null; render(); guardarItems(true); }

function agregar(){
  const nombre = $('f-nombre').value.trim();
  const precio = parseFloat($('f-precio').value) || 0;
  const cant = parseInt($('f-cant').value) || 1;
  const categoria = $('f-categoria').value || 'Otros';
  if(!nombre){ $('f-nombre').focus(); return; }
  items.push({nombre, precio, cant, comprado:false, categoria});
  $('f-nombre').value = '';
  $('f-precio').value = '';
  $('f-cant').value = 1;
  render();
  guardarItems(true);
  $('f-nombre').focus();
}

$('btn-add').addEventListener('click', agregar);
[$('f-nombre'), $('f-precio'), $('f-cant')].forEach(inp=>{
  inp.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); agregar(); }
  });
});

function mostrarToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

$('btn-copiar').addEventListener('click', ()=>{
  if(items.length === 0){ mostrarToast('La lista está vacía'); return; }
  let texto = '🛒 LISTA DE COMPRAS\n\n';
  CATEGORIAS.forEach(cat=>{
    const deEstaCat = items.filter(it => (it.categoria || 'Otros') === cat.nombre);
    if(deEstaCat.length === 0) return;
    texto += `--- ${cat.nombre.toUpperCase()} ---\n`;
    deEstaCat.forEach(it=>{
      const marca = it.comprado ? '[x]' : '[ ]';
      texto += `${marca} ${it.nombre} - ${it.cant} x ${fmt(it.precio)} = ${fmt(it.precio*it.cant)}\n`;
    });
    texto += '\n';
  });
  const pend = items.filter(i=>!i.comprado).reduce((s,i)=>s+i.precio*i.cant,0);
  const comp = items.filter(i=>i.comprado).reduce((s,i)=>s+i.precio*i.cant,0);
  texto += `Pendiente: ${fmt(pend)}\nComprado: ${fmt(comp)}\nTOTAL: ${fmt(pend+comp)}`;

  navigator.clipboard.writeText(texto).then(()=>{
    mostrarToast('Lista copiada ✅');
  }).catch(()=>{
    mostrarToast('No se pudo copiar');
  });
});

$('btn-finalizar').addEventListener('click', async ()=>{
  if(items.length === 0) return;
  const total = items.reduce((s,i)=>s+i.precio*i.cant,0);
  const confirmar = confirm(`¿Finalizar esta compra por ${fmt(total)} y guardarla en el historial? Esto vacía la lista actual.`);
  if(!confirmar) return;
  historial.unshift({
    fecha: new Date().toLocaleString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}),
    total,
    items: JSON.parse(JSON.stringify(items))
  });
  items = [];
  editIndex = null;
  filtroActivo = 'Todas';
  render();
  await Promise.all([guardarItems(true), guardarHistorial()]);
  mostrarToast('Compra guardada en el historial 📦');
});

$('btn-desmarcar').addEventListener('click', async ()=>{
  if(items.length === 0) return;
  const marcados = items.filter(i=>i.comprado).length;
  if(marcados === 0){ mostrarToast('No hay nada marcado como comprado'); return; }
  const confirmar = confirm(`¿Desmarcar los ${marcados} productos comprados y volverlos a pendiente?`);
  if(!confirmar) return;
  items.forEach(it => it.comprado = false);
  render();
  guardarItems(true);
  mostrarToast('Se desmarcaron todos ↺');
});

$('btn-importar').addEventListener('click', async ()=>{
  const confirmar = confirm(`Esto va a agregar ${SEED_ITEMS.length} productos de tu planilla a la lista actual (no borra lo que ya tenías). ¿Continuar?`);
  if(!confirmar) return;
  items = items.concat(JSON.parse(JSON.stringify(SEED_ITEMS)));
  render();
  guardarItems(true);
  mostrarToast(`Se importaron ${SEED_ITEMS.length} productos 📥`);
});

function renderHistorial(){
  const cont = $('historial');
  if(historial.length === 0){
    cont.innerHTML = '<div class="empty">Todavía no hay compras finalizadas.</div>';
    return;
  }
  cont.innerHTML = historial.map((h, i) => `
    <div class="hist-item" onclick="toggleDetalle(${i})">
      <span class="fecha">${h.fecha}</span>
      <span>
        <span class="monto">${fmt(h.total)}</span>
        <button class="borrar-h" onclick="event.stopPropagation(); borrarHist(${i})">🗑</button>
      </span>
    </div>
    <div class="hist-detalle" id="hd-${i}">
      ${h.items.map(it=>`${it.comprado?'✓':'○'} [${escapeHtml(it.categoria||'Otros')}] ${escapeHtml(it.nombre)} — ${it.cant} x ${fmt(it.precio)} = ${fmt(it.precio*it.cant)}`).join('<br>')}
    </div>
  `).join('');
}

function toggleDetalle(i){
  $(`hd-${i}`).classList.toggle('show');
}

function borrarHist(i){
  historial.splice(i,1);
  render();
  guardarHistorial();
}

llenarSelectCategorias();
cargarDatos();
</script>
</body>
</html>
